[package]
name = "sc-og"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
form_urlencoded = "1"
futures = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
takumi = { version = "2.7", features = ["from-html"] }
dotenvy = "0.15.7"

[profile.release]
lto = "thin"
strip = true
